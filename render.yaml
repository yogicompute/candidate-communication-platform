# Render Blueprint: Django API (+ dummy provider process) and PostgreSQL.
# The Next.js frontend is deployed separately on Vercel (see README).
databases:
  - name: ccp-db
    plan: free
    databaseName: ccp
    user: ccp

services:
  - type: web
    name: ccp-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./bin/build.sh
    startCommand: ./bin/start.sh
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ccp-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DUMMY_PROVIDER_API_KEY
        generateValue: true
      - key: PROVIDER_WEBHOOK_SECRET
        generateValue: true
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "10"
      - key: WEB_CONCURRENCY
        value: "2"
